# Supabase CLI config. Most local-dev values are defaults; the hosted project
# is the source of truth for auth/storage settings.
project_id = "mytutor"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]

[db]
port = 54322
major_version = 17

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:8081"
additional_redirect_urls = ["mytutor://"]

[edge_runtime]
enabled = true

# tutor-chat streams SSE; JWTs are verified in-function as well.
[functions.tutor-chat]
verify_jwt = true

[functions.ingest-material]
verify_jwt = true

[functions.finish-session]
verify_jwt = true

[functions.export-vault]
verify_jwt = true

[functions.weekly-recap]
verify_jwt = true

[functions.extract-grade]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
